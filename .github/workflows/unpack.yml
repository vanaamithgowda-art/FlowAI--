
name: Extract Flow AI files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p /tmp/flow-ai
          unzip -q Flow-AI-Cloudflare-AI.zip -d /tmp/flow-ai

          echo "Files found in ZIP:"
          find /tmp/flow-ai -maxdepth 4 -type f | head -80

          PACKAGE="$(find /tmp/flow-ai -type f -name package.json -print -quit)"
          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found in ZIP"
            exit 1
          fi

          DIR="$(dirname "$PACKAGE")"
          cp -a "$DIR/." .

          test -f package.json
          echo "SUCCESS: package.json extracted"

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Flow AI application"
          git push
