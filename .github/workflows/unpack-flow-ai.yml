
name: Unpack Flow AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p /tmp/flow-ai
          unzip -q Flow-AI-Cloudflare-AI.zip -d /tmp/flow-ai

          ROOT="$(find /tmp/flow-ai -type f -name package.json -print -quit)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: No package.json found inside ZIP."
            exit 1
          fi

          DIR="$(dirname "$ROOT")"
          cp -a "$DIR/." .
          test -f package.json

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Flow AI application"
          git push
