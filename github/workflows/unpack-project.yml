name: Unpack Flow AI ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project files
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Flow-AI-Cloudflare-AI.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Flow AI ZIP not found in repository root."
            exit 1
          fi

          mkdir -p /tmp/flow-ai-zip
          unzip -q "$ZIP_FILE" -d /tmp/flow-ai-zip

          if [ ! -f /tmp/flow-ai-zip/flow-ai/package.json ]; then
            echo "The ZIP has an unexpected folder structure."
            exit 1
          fi

          cp -a /tmp/flow-ai-zip/flow-ai/. .
          rm "$ZIP_FILE"

      - name: Save extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Extract Flow AI project files"
          git push
